  <h3>Table Sample</h3>
  <form>
    <table border="2">
      <thead>
        <tr>
          <th>S.no</th>
          <th>S.name</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>
            <label>First Name</label>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Lastname:</td>
        </tr>
        <tr>
          <td><label>Select country:</label></td>
          <td>
            <select>
              <option value="india">India</option>
              <option value="Southkorea">South Korea</option>
              <option value="Hanoi">Hanoi</option>
            </select>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <input type="button" onclick="alert('Hello World')" value="Click me!" />
          </td>
        </tr>
        <tr>
          <td>Choose your favourite language:</td>
          <td>
            <input type="radio" name="fav_language" value="HTML" />
            <label for="html">HTML</label><br />
            <input type="radio" name="fav_language" value="CSS" />
            <label for="css">CSS</label><br />
            <input type="radio" name="fav_language" value="Javascript" />
            <label for="javascript">Javascript</label><br />
            <input type="radio" name="fav_language" value="React" />
            <label for="react">React</label>
          </td>
        </tr>
        <tr>
          <td><label for="favcolor">Select your favourite colour:</label></td>
          <td><input type="color" id="favcolor" name="favcolor" /></td>
        </tr>
        <tr>
          <td><label for="datemax">Enter a date before 1980-01-01:</label></td>
          <td><input type="date" id="datemax" name="datemax" max="1979-12-31" /></td>
        </tr>
        <tr>
          <td><label for="datemin">Enter a date before 2000-01-01:</label></td>
          <td><input type="date" id="datemin" name="datemin" max="2000-01-01" /></td>
        </tr>
        <tr>
          <td><label>Password:</label></td>
          <td><input type="password" name="pwd" /></td>
        </tr>
        <tr>
          <td><label for="bdaymonth">Birthday (month and year):</label></td>
          <td><input type="month" id="bdaymonth" name="bdaymonth" /></td>
        </tr>
      </tbody>
    </table>
  </form>
</body>

</html>
